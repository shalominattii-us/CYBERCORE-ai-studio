name: CyberGym Conditioning & Prediction Gate

on:
  push:
    branches: [ main ]
    paths:
      - 'engines/cybergym/**'
      - 'engines/prediction/**'
      - 'engines/worker_api.py'
      - 'src/components/AgenticAmericaView.tsx'
      - 'server.ts'
  workflow_dispatch:

jobs:
  cybergym-conditioning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv & dependencies
        run: |
          pip install uv
          uv venv .venv
          uv pip install --python .venv/bin/python numpy pandas scikit-learn lightgbm requests fastapi uvicorn pydantic

      - name: Run CyberGym Clean Lab Conditioning
        run: |
          .venv/bin/python -m engines.cybergym.lab_studio --persona athlete --topic "Peak Mesocycle Readiness"
          .venv/bin/python -m engines.cybergym.lab_studio --persona research_analyst --topic "Cross-Domain Signal Synthesis"
          .venv/bin/python -m engines.cybergym.lab_studio --persona constitutional_law_scholar --topic "Executive Authority & AI Governance"

      - name: Run Prediction Engine Smoke Test
        run: |
          .venv/bin/python -m engines.prediction.cli --symbol BTC --days 30 --horizon 1
