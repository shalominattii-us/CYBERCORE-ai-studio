name: Production Smoke & Zero-Fake-Balance Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-production:
    name: Typecheck, Build, Zero-Fake-Balance & Live Node v22 Boot Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enforce Zero-Fake-Balance Invariant (Full Repo Audit Script)
        run: node scripts/verify-zero-fake-balance.mjs

      - name: Upload Zero-Fake-Balance Audit Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zero-fake-balance-audit
          path: artifacts/verification/zero-fake-balance-audit.json

      - name: Install dependencies
        run: npm install --allow-git=all

      - name: TypeScript typecheck (tsc --noEmit)
        run: npm run lint

      - name: Production build (Vite + esbuild)
        run: npm run build

      - name: Live Node.js v22 Production Server Boot & API Smoke Test
        run: |
          NODE_ENV=production PORT=3099 node server.ts > /tmp/ci_server.log 2>&1 &
          SRV_PID=$!
          sleep 3
          for ep in \
            /health \
            /api/domain/status \
            /api/auth/session/status \
            /api/nanotransactions/status \
            /api/rpc/research/contract \
            /stardusk-bridge/contract.json \
            /api/stardusk/overview \
            /api/stardusk/logs \
            /api/stardusk/rog-bridge \
            /api/openplanter/status \
            /api/prism-swarm/status \
            /api/championship/status \
            /api/edge-worker/status \
            /api/formal-verify/status \
            /api/wave-surfer/status \
            /api/eagle-shield/status \
            /api/sovereign-os/status \
            /stardusk.html \
            /stardust.html \
            /aegentix-cockpit/index.html; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3099${ep}")
            echo "${ep} -> HTTP ${CODE}"
            if [ "$CODE" != "200" ]; then
              cat /tmp/ci_server.log
              kill $SRV_PID 2>/dev/null || true
              exit 1
            fi
          done
          kill $SRV_PID 2>/dev/null || true
          echo "PASS: All 18 production endpoints & Stardusk Space Company decks returned HTTP 200 OK"
